<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Everything on screen is a pure function of loop time t in [0, 10).
 *  That keeps the loop seamless and lets a recorder step it frame by
 *  frame. Units inside the scene are card pixels (card = 1000 x 540).
 * ------------------------------------------------------------------ */

const LOOP = 10;
const TX = 122, TW = 756, FLOOR = 490, WS = 1.95;   // WS: worker scale          // track left, track width, floor line
const HIP = 28, SHOULDER_F = [6, -40], SHOULDER_B = [-5, -39], ARM = 36;
const TRACK_MID = 365;   // = FLOOR - 64 * WS: he pushes at shoulder height                          // hands aim here
const E99 = TX + TW * 0.99;

const qs = new URLSearchParams(location.search);
const CAPTURE = qs.has('capture');
if (CAPTURE) document.documentElement.classList.add('capture');

/* ---------- easing + keyframe tracks ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const EASE = {
  l: x => x,
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  o: x => 1 - Math.pow(1 - x, 3),
  o5: x => 1 - Math.pow(1 - x, 5),
  i: x => x * x,
  i3: x => x * x * x,
  ob: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  h: x => (x < 1 ? 0 : 1),
};
// keys: [time, value, easeIntoThisKey]
function T(keys) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const k = keys[i];
      if (t < k[0]) {
        const p = keys[i - 1];
        return p[1] + (k[1] - p[1]) * EASE[k[2] || 'io']((t - p[0]) / (k[0] - p[0]));
      }
    }
    return keys[keys.length - 1][1];
  };
}
const damp = (t, t0, amp, freq, decay) => (t < t0 ? 0 : amp * Math.exp(-decay * (t - t0)) * Math.sin(2 * Math.PI * freq * (t - t0)));

/* ---------- the story ---------- */
// progress: hermite through (time, percent, percent/s), dead stop at 99
const PK = [[0.40, 0, 0], [0.72, 7, 38], [2.40, 60, 27], [4.00, 90, 13], [4.62, 99, 14]];
const POP = 7.78, DONE = 8.06, FADE_OUT = 9.30, RESET = 9.62;
function progress(t) {
  if (t >= RESET) return 0;
  if (t < PK[0][0]) return 0;
  if (t >= POP) return lerp(99, 100, EASE.o(clamp((t - POP) / 0.07)));
  for (let i = 1; i < PK.length; i++) {
    if (t < PK[i][0]) {
      const [t0, p0, v0] = PK[i - 1], [t1, p1, v1] = PK[i];
      const d = t1 - t0, u = (t - t0) / d, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * d * v0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * d * v1;
    }
  }
  return 99;
}
const edgeAt = t => TX + TW * progress(t) / 100;

const LEAN = T([[0, 4], [0.24, -7], [0.40, 15, 'o'], [0.72, 17], [2.40, 19], [3.10, 27], [4.00, 32], [4.62, 34],
  [4.70, 42, 'o'], [4.86, 33], [5.15, 35, 'l'], [5.36, -5], [5.48, -2], [5.95, -3, 'l'], [6.12, 24], [6.40, 22, 'l'],
  [6.56, 0], [7.06, 0, 'l'], [7.18, 37, 'o'], [7.38, 38, 'l'], [7.52, -15], [7.58, 9, 'o5'], [7.64, 9, 'l'],
  [7.76, -3, 'o'], [7.86, -7, 'o'], [8.06, 0], [8.22, 5], [8.32, -4], [9.62, 4, 'h'], [10, 4]]);
const CROUCH = T([[0, 0], [0.24, 7], [0.40, 0, 'o'], [4.62, 1], [4.70, 4, 'o'], [4.86, 1.5], [5.15, 1.5, 'l'], [5.36, 0],
  [6.12, 5], [6.40, 5, 'l'], [6.56, 0], [7.38, 1, 'l'], [7.52, 6], [7.58, 0, 'o5'], [8.06, 0, 'l'], [8.24, 10],
  [8.34, 9, 'l'], [9.62, 0, 'h'], [10, 0]]);
const PUSHW = T([[0, 1], [5.15, 1, 'l'], [5.30, 0], [7.05, 0, 'l'], [7.17, 1], [7.38, 1, 'l'], [7.46, 0], [9.62, 1, 'h'], [10, 1]]);
const STRAIN = T([[4.62, 0], [4.68, 1, 'o'], [5.12, 1, 'l'], [5.22, 0], [7.14, 0, 'l'], [7.20, 1], [7.36, 1, 'l'], [7.42, 0]]);
const BREATH = T([[5.30, 0], [5.50, 1], [6.45, 1, 'l'], [6.65, 0]]);
const STRIDE = T([[0, 26], [0.72, 31], [2.40, 30, 'l'], [3.60, 21], [4.62, 15], [4.70, 9], [5.15, 9, 'l'], [5.30, 18], [7.05, 18, 'l'], [7.18, 9], [9.62, 26, 'h'], [10, 26]]);
const LIFT = T([[0, 9], [2.40, 9, 'l'], [3.60, 6], [4.62, 4], [4.70, 3], [5.20, 3, 'l'], [5.30, 6], [7.10, 6, 'l'], [7.20, 3], [9.62, 9, 'h'], [10, 9]]);
const LEGOW = T([[7.38, 0], [7.46, 1], [9.62, 1, 'l'], [9.621, 0, 'l'], [10, 0]]);

const HOP = T([[7.48, 0], [7.58, -32, 'o'], [7.64, -32, 'l'], [7.76, 0, 'i'], [7.78, 0, 'l'], [7.86, -11, 'o'], [7.98, 0, 'i']]);

// free arms (raise angle: 0 down, 90 forward, 180 up)

  [6.56, 8], [7.06, 8, 'l'], [7.38, 60], [7.52, -38], [7.58, -18, 'o5'], [7.64, -18, 'l'], [7.76, 20], [7.86, 150, 'o'],

const TILT = T([[0, 0], [0.24, -5], [0.40, 4, 'o'], [4.62, 8], [4.70, 18, 'o'], [4.86, 6], [5.15, 8], [5.36, -8], [5.50, 10],

  [7.10, 0, 'l'], [7.18, 12], [7.52, -12], [7.58, 10, 'o5'], [7.64, 10, 'l'], [7.76, 0], [7.86, -12, 'o'], [8.06, 0],
  [8.26, 14], [8.52, -6, 'i'], [8.62, 10, 'o'], [8.78, -3], [8.92, 0], [9.62, 0, 'h'], [10, 0]]);
const FACE_X = T([[0, 7], [6.86, 7, 'l'], [6.96, 0], [7.10, 0, 'l'], [7.18, 7], [9.62, 7, 'h'], [10, 7]]);
const PUP_X = T([[0, 2.4], [4.62, 2.4, 'l'], [5.36, 1], [5.95, 1.5], [6.56, 2], [6.62, 3.1], [6.86, 3.1, 'l'], [6.96, 0],

const PUP_Y = T([[0, .5], [4.62, .5, 'l'], [5.36, -1.5], [5.95, 1], [6.56, .5], [6.62, 2.6], [6.86, 2.6, 'l'], [6.96, 0],

const LID = T([[0, .1], [0.06, .1, 'l'], [0.12, 1, 'o'], [0.20, .1], [2.40, .08, 'l'], [3.20, .3], [4.62, .36],

  [6.86, .42], [6.92, 1, 'o'], [7.00, .42], [7.10, .42, 'l'], [7.18, .64], [7.38, .62, 'l'], [7.52, .46], [7.58, .74, 'o5'],
  [7.64, .74, 'l'], [7.76, .3], [7.84, 0, 'o'], [8.06, .2], [8.30, .62], [8.50, .92], [8.60, 1], [9.62, .1, 'h'], [10, .1]]);
const BROW = T([[0, -3], [0.40, -12], [2.40, -10, 'l'], [3.20, 15], [4.62, 18], [4.68, -16, 'o'], [4.80, 20], [5.15, 20, 'l'],
  [5.36, -12], [5.95, -12, 'l'], [6.40, -15], [6.56, 0], [7.10, 0, 'l'], [7.18, 24, 'o'], [7.64, 27, 'l'], [7.78, 27, 'l'],

// mouth states with short crossfades
const MOUTH = [[0, 'smile'], [3.00, 'grit'], [4.66, 'o'], [4.76, 'grit'], [5.26, 'open'], [6.48, 'flat'], [7.14, 'grit'],
  [7.80, 'o'], [8.24, 'open'], [8.58, 'o'], [9.62, 'smile']];
const MOUTH_IDS = ['smile', 'grit', 'open', 'flat', 'o'];
// sweat visibility windows
const SWEAT = T([[3.10, 0], [3.40, 1], [5.70, 1, 'l'], [5.76, 0, 'o'], [7.10, 0, 'l'], [7.24, 1], [7.86, 1, 'l'], [8.0, 0]]);

// fades and UI
const WORKER_A = T([[FADE_OUT, 1], [9.58, 0], [RESET, 0, 'l'], [10, 1, 'o']]);
const FILL_A = T([[FADE_OUT, 1], [9.58, 0], [RESET, 1, 'h']]);
const OLD_A = T([[DONE, 1], [DONE + .18, 0, 'o'], [RESET, 0, 'l'], [10, 1, 'o']]);   // "Uploading", number
const NEW_A = T([[DONE + .04, 0], [DONE + .28, 1, 'o'], [FADE_OUT, 1, 'l'], [9.58, 0]]); // "Uploaded", Done
const CHECK = T([[DONE + .16, 0], [DONE + .42, 1, 'o']]);
const VPOP = T([[POP, 99], [POP + .3, 100, 'ob']]);

/* ---------- character kinematics ---------- */
const rot = (x, y, deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [x * c - y * s, x * s + y * c]; };
// hand position (root coords, hip-relative to root origin at the feet) for an arm raise angle a
function hand(sh, a, lean, sx, sy, hipH) {
  const [ax, ay] = rot(0, ARM, -a);
  const [bx, by] = rot((sh[0] + ax) * sx, (sh[1] + ay) * sy, lean);
  return [bx, by - hipH];
}
// arm angle that puts the hand at height y (bisection; y decreases as a rises)
function solveArm(sh, y, lean, sx, sy, hipH) {
  let lo = -20, hi = 175;
  for (let i = 0; i < 22; i++) {
    const mid = (lo + hi) / 2;
    if (hand(sh, mid, lean, sx, sy, hipH)[1] > y) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function bodyPose(t) {
  const lean = LEAN(t) + STRAIN(t) * 1.6 * Math.sin(t * 2 * Math.PI * 11);
  const crouch = CROUCH(t);
  const hipH = HIP - crouch;
  const breath = BREATH(t) * Math.sin(t * 2 * Math.PI * 2.7);
  const sy = 1 - crouch * 0.011 + breath * 0.035, sx = 1 + crouch * 0.008 - breath * 0.015;
  const pushW = PUSHW(t);
  const target = (TRACK_MID - FLOOR) / WS;
  const aF = solveArm(SHOULDER_F, target, lean, sx, sy, hipH);
  const aB = solveArm(SHOULDER_B, target - 4, lean, sx, sy, hipH);
  const reach = hand(SHOULDER_F, aF, lean, sx, sy, hipH)[0];
  const pushedX = edgeAt(t) - WS * (4 + reach);
  return { lean, crouch, hipH, sx, sy, pushW, aF, aB, pushedX };
}

// free (not pushing) root positions are anchored to where he let go
const C1 = bodyPose(5.15).pushedX, C2 = bodyPose(7.38).pushedX;
const KICK_X = E99 - WS * (84 / 90 * 28 + 9.5);
const FREE_X = T([[5.15, C1], [5.36, C1 - 15], [7.05, C1 - 15, 'l'], [7.17, C2], [7.38, C2, 'l'], [7.52, KICK_X - 9],
  [7.58, KICK_X, 'o5'], [7.64, KICK_X, 'l'], [7.76, KICK_X - 8, 'o'], [9.62, KICK_X - 8, 'l']]);
// at 0% he stands on the floor just behind the bar's start, inside the card, until the fill reaches his hands
const MIN_X = 104;
const rootXAt = t => { const b = bodyPose(t); return Math.max(MIN_X, lerp(FREE_X(t), b.pushedX, b.pushW)); };

/* ---------- gait: integrate step phase from distance travelled ---------- */
const GDT = 1 / 600, GN = Math.round(LOOP / GDT) + 2;
const PHI = new Float32Array(GN), PHID = new Float32Array(GN);
const steps = [];   // foot plants: {t, x, v}
(() => {
  let phi = 0.5, prevX = rootXAt(0);
  for (let i = 0; i < GN; i++) {
    const t = i * GDT;
    const x = rootXAt(Math.min(t, LOOP));
    const d = (x - prevX) / (STRIDE(t) * WS) + STRAIN(t) * 6.4 * GDT;
    prevX = x;
    const before = phi;
    phi = t >= RESET ? 0.5 : phi + d;
    PHI[i] = phi; PHID[i] = d / GDT;
    if (t > 0.3 && t < RESET && Math.floor(phi) !== Math.floor(before) && LEGOW(t) < 0.5) {
      steps.push({ t, x, v: Math.abs(d / GDT), strain: STRAIN(t) });
    }
  }
})();
const sample = (arr, t) => { const f = clamp(t, 0, LOOP) / GDT, i = Math.floor(f), u = f - i; return lerp(arr[i], arr[Math.min(i + 1, GN - 1)], u); };

function footFor(t, idx, hipH, lean) {
  const L = STRIDE(t), phi = sample(PHI, t) + idx, speed = Math.abs(sample(PHID, t));
  const u = ((phi % 2) + 2) % 2;
  let x, lift = 0;
  if (u < 1) x = L / 2 - u * L;
  else { const w = u - 1; x = -L / 2 + EASE.io(w) * L; lift = Math.sin(Math.PI * w) * LIFT(t) * clamp(speed / 3); }
  x -= Math.max(0, lean) * 0.32 + (idx ? 2 : -2);
  const ang = Math.atan2(x, hipH - lift) * 180 / Math.PI;
  const len = Math.hypot(x, hipH - lift);
  return { ang, len, lift };
}

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const el = {
  card: $('card'), fill: $('fill'), track: $('track'), worker: $('worker'), root: $('root'), body: $('body'),
  legF: $('legF'), legB: $('legB'), shoeF: $('shoeF'), shoeB: $('shoeB'), armF: $('armF'), armB: $('armB'),
  headPivot: $('headPivot'), head: $('head'), face: $('face'), eyeB: $('eyeB'), eyeF: $('eyeF'),
  pupB: $('pupB'), pupF: $('pupF'), lidB: $('lidB'), lidF: $('lidF'), eyeBOpen: $('eyeBOpen'), eyeFOpen: $('eyeFOpen'),
  eyeBShut: $('eyeBShut'), eyeFShut: $('eyeFShut'), browB: $('browB'), browF: $('browF'),
  mSmile: $('mSmile'), mGrit: $('mGrit'), mOpen: $('mOpen'), mFlat: $('mFlat'), mO: $('mO'),
  sw: [$('sw0'), $('sw1'), $('sw2')], fly: $('flyDrop'), shadow: $('shadow'), puffs: $('puffs'),
  c0: $('c0'), c1: $('c1'), c2: $('c2'), num: $('num'), done: $('done'), checkWipe: $('checkWipe'),
  titleA: $('titleA'), titleB: $('titleB'), subA: $('subA'), subB: $('subB'), mb: $('mb'), eta: $('eta'),
};
const mouthEl = { smile: el.mSmile, grit: el.mGrit, open: el.mOpen, flat: el.mFlat, o: el.mO };

const PUFFN = 16, puffEls = [];
for (let i = 0; i < PUFFN; i++) {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('r', '1'); c.setAttribute('fill', '#cfcfd4'); c.setAttribute('opacity', '0');
  el.puffs.appendChild(c); puffEls.push(c);
}
// dust: footfalls in the fast part, plus the landing when he collapses
const puffs = steps.filter(s => s.t < 2.55 && s.v > 3).map((s, i) => { const r = rng(i + 3); return { t: s.t, x: s.x - 12 * WS - r() * 6, dir: -1, k: i, j: r(), h: r() }; });
puffs.push({ t: 8.52, x: 0, dir: -1, k: 90, land: true }, { t: 8.53, x: 0, dir: 1, k: 91, land: true });

const fmt = (v, n = 2) => +v.toFixed(n);
const setT = (node, s) => node.setAttribute('transform', s);
const setO = (node, o) => node.setAttribute('opacity', fmt(o, 3));

function mouthWeights(t) {
  let i = 0;
  while (i + 1 < MOUTH.length && t >= MOUTH[i + 1][0]) i++;
  const w = {}; MOUTH_IDS.forEach(k => (w[k] = 0));
  const cur = MOUTH[i][1], prev = i > 0 ? MOUTH[i - 1][1] : MOUTH[MOUTH.length - 1][1];
  const u = sstep(0, 0.07, t - MOUTH[i][0]);
  w[cur] += u; w[prev] += 1 - u;
  return w;
}

let lastText = '';
function render(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const b = bodyPose(t);
  const freeX = FREE_X(t);
  const rootX = Math.max(MIN_X, lerp(freeX, b.pushedX, b.pushW));
  const p = progress(t);

  /* card: nudge on the kick, settle bounce at Done */
  const shake = damp(t, 7.58, 3.2, 13, 16);
  const bounce = damp(t, DONE, 0.016, 2.6, 6.5);
  el.card.style.transform = `translate3d(${fmt(shake)}px,0,0) scale(${fmt(SCALE * (1 + bounce), 5)})`;

  /* bar */
  setT(el.fill, `translate(${fmt(-TW * (1 - p / 100))} 0)`);
  const bump = t >= POP ? 0.2 * Math.exp(-13 * (t - POP)) * Math.cos(2 * Math.PI * 5 * (t - POP)) * sstep(0, .02, t - POP) : 0;
  setT(el.track, `translate(${TX + TW} ${TRACK_MID}) scale(${fmt(1 + bump * 0.02, 4)} ${fmt(1 + bump, 4)}) translate(${-(TX + TW)} ${-TRACK_MID})`);
  setO(el.fill, FILL_A(t));

  /* worker root: feet at the origin */
  const fallE = FALL(t);
  const impact = t > 8.52 ? -6 * Math.exp(-9 * (t - 8.52)) * Math.abs(Math.sin(15 * (t - 8.52))) : 0;
  const tremble = STRAIN(t) * 0.9 * Math.sin(t * 2 * Math.PI * 23);
  const lying = Math.sin(t * 2 * Math.PI * 1.1) * sstep(8.7, 9.0, t) * (t < RESET ? 1 : 0);
  const rx = rootX + tremble, ry = FLOOR + impact;
  setT(el.root, `translate(${fmt(rx)} ${fmt(ry)}) scale(${WS}) translate(0 ${fmt(HOP(t) - fallE * 28)}) rotate(${fmt(-88 * fallE)})`);
  setO(el.worker, WORKER_A(t));

  /* legs */
  const legOW = LEGOW(t);
  const legs = [[el.legF, el.shoeF, 0, LEG_F, LEGLEN_F], [el.legB, el.shoeB, 1, LEG_B, () => 1]];
  for (const [leg, shoe, idx, A, LL] of legs) {
    const g = footFor(t, idx, b.hipH, b.lean);
    const ang = lerp(g.ang, A(t), legOW);
    const len = lerp(g.len, HIP * LL(t) - b.crouch * 0.6, legOW);
    setT(leg, `translate(0 ${fmt(-b.hipH)}) rotate(${fmt(-ang)}) scale(1 ${fmt(len / 28, 3)})`);
    const r = ang * Math.PI / 180;
    const fx = Math.sin(r) * len, fy = -b.hipH + Math.cos(r) * len;
    const shoeRot = -ang * (0.22 + 0.78 * legOW) + (1 - legOW) * g.lift * 1.2;
    setT(shoe, `translate(${fmt(fx)} ${fmt(fy + 2)}) rotate(${fmt(shoeRot)})`);
  }

  /* torso + arms */
  setT(el.body, `translate(0 ${fmt(-b.hipH)}) rotate(${fmt(b.lean)}) scale(${fmt(b.sx, 4)} ${fmt(b.sy, 4)})`);
  const flop = t > 8.52 ? 14 * Math.exp(-7 * (t - 8.58)) * Math.sin(2 * Math.PI * 2.2 * (t - 8.52)) : 0;
  const aF = lerp(ARM_F(t), b.aF, b.pushW) + flop + lying * 3;
  const aB = lerp(ARM_B(t), b.aB, b.pushW) - flop * 0.8;
  setT(el.armF, `translate(${SHOULDER_F[0]} ${SHOULDER_F[1]}) rotate(${fmt(-aF)})`);
  setT(el.armB, `translate(${SHOULDER_B[0]} ${SHOULDER_B[1]}) rotate(${fmt(-aB)})`);

  /* head */
  const headLag = t > 8.56 ? 7 * Math.exp(-8 * (t - 8.56)) * Math.sin(2 * Math.PI * 3 * (t - 8.56)) : 0;
  const nod = damp(t, 4.62, 7, 4, 7);
  const tilt = TILT(t) + headLag + nod;
  const hsq = 1 + damp(t, POP, 0.05, 5, 9) + damp(t, 8.52, 0.07, 4, 8);
  setT(el.headPivot, `translate(0 -46) rotate(${fmt(tilt)})`);
  setT(el.head, `translate(0 -27) scale(${fmt(2 - hsq, 4)} ${fmt(hsq, 4)})`);

  const fx = FACE_X(t);
  setT(el.face, `translate(${fmt(fx)} 3)`);
  const persp = fx / 7;   // 1 = three-quarter view, 0 = facing camera
  setT(el.eyeB, `translate(${fmt(-11 + persp * 0.5)} -3) scale(${fmt(1 - 0.1 * persp, 3)} 1)`);
  setT(el.eyeF, `translate(${fmt(11 - persp * 0.6)} -3)`);
  const px = PUP_X(t), py = PUP_Y(t);
  setT(el.pupB, `translate(${fmt(px * 0.9)} ${fmt(py)})`);
  setT(el.pupF, `translate(${fmt(px)} ${fmt(py)})`);
  const lid = LID(t);
  setT(el.lidB, `translate(0 ${fmt(lid * 17.4)})`);
  setT(el.lidF, `translate(0 ${fmt(lid * 17.4)})`);
  const shut = sstep(0.86, 0.98, lid);
  setO(el.eyeBOpen, 1 - shut); setO(el.eyeFOpen, 1 - shut);
  setO(el.eyeBShut, shut); setO(el.eyeFShut, shut);
  const brow = BROW(t), browY = -14.5 - Math.max(0, -brow) * 0.14 + Math.max(0, brow) * 0.05;
  setT(el.browB, `translate(0 ${fmt(browY)}) rotate(${fmt(brow)})`);
  setT(el.browF, `translate(0 ${fmt(browY)}) rotate(${fmt(-brow)})`);

  const mw = mouthWeights(t);
  const pant = 1 + 0.35 * Math.sin(t * 2 * Math.PI * 2.7) * BREATH(t);
  for (const k of MOUTH_IDS) setO(mouthEl[k], mw[k]);
  setT(el.mOpen, `translate(0 1) scale(1 ${fmt(pant, 3)}) translate(0 -1)`);

  /* sweat: three drops on independent cycles */
  const sw = SWEAT(t);
  const spots = [[-22, -12], [20, -20], [-15, 6]];
  el.sw.forEach((d, i) => {
    const c = ((t + i * 0.31) / 0.95) % 1;
    const a = sstep(0, 0.14, c) * (1 - sstep(0.78, 1, c)) * sw;
    const s = 0.55 + 0.45 * sstep(0, 0.2, c);
    setT(d, `translate(${spots[i][0]} ${fmt(spots[i][1] + EASE.i(c) * 9)}) scale(${fmt(s, 3)})`);
    setO(d, a);
  });

  /* the drop flicked off during the wipe (scene coords) */
  const fu = (t - 5.74) / 0.42;
  if (fu > 0 && fu < 1) {
    const x0 = rootX + 30 * WS, y0 = FLOOR - 112 * WS;
    setT(el.fly, `translate(${fmt(x0 + 70 * fu)} ${fmt(y0 - 46 * fu + 150 * fu * fu)}) rotate(${fmt(40 + 120 * fu)})`);
    setO(el.fly, 1 - sstep(0.75, 1, fu));
  } else setO(el.fly, 0);

  /* contact shadow: stretches with the lean, spreads when he lies down */
  const lean = Math.max(0, b.lean);
  const standRx = (25 + lean * 0.5) * WS, standCx = rootX + lean * 0.35 * WS;
  const hop = -HOP(t);
  const lieCx = rootX - 54 * WS, lieRx = 70 * WS;
  const sCx = lerp(standCx, lieCx, fallE), sRx = lerp(standRx, lieRx, fallE) * (1 - hop * 0.012);
  el.shadow.setAttribute('cx', fmt(sCx)); el.shadow.setAttribute('cy', FLOOR + 1);
  el.shadow.setAttribute('rx', fmt(sRx)); el.shadow.setAttribute('ry', fmt(lerp(5.5, 7, fallE)));
  setO(el.shadow, WORKER_A(t) * (1 - hop * 0.022));

  /* dust puffs */
  let n = 0;
  for (const pf of puffs) {
    const age = t - pf.t, life = pf.land ? 0.6 : 0.42;
    if (age < 0 || age > life || n >= PUFFN) continue;
    const u = age / life, e = EASE.o(u);
    const r = pf.land ? 10 + e * 16 : (2.5 + pf.j * 2) + e * (6 + pf.j * 4);
    const baseX = pf.land ? rootX - 54 * WS + pf.dir * 62 * WS : pf.x;
    const node = puffEls[n++];
    node.setAttribute('cx', fmt(baseX + pf.dir * e * (pf.land ? 30 : 10 + pf.h * 10)));
    node.setAttribute('cy', fmt(FLOOR - 3 - e * (pf.land ? 10 : 8 + pf.h * 8)));
    node.setAttribute('r', fmt(r));
    setO(node, (pf.land ? 0.38 : 0.8) * (1 - u) * (1 - u) * sstep(0, 0.1, u));
  }
  for (; n < PUFFN; n++) setO(puffEls[n], 0);

  /* rolling digits */
  let v;
  if (t >= RESET) v = 0;
  else if (t >= POP) v = VPOP(t);
  else { const k = Math.floor(p), f = p - k; v = k + EASE.o(clamp(f / 0.55)); }
  const ones = v % 10;
  const carry = Math.max(0, ones - 9);
  const tens = Math.floor(v / 10) + carry;
  const hund = Math.floor(v / 100) + (Math.floor(v / 10) % 10 === 9 ? carry : 0);
  el.c0.style.transform = `translate3d(0,${fmt(-ones * 112)}px,0)`;
  el.c1.style.transform = `translate3d(0,${fmt(-Math.min(tens, 11) * 112)}px,0)`;
  el.c2.style.transform = `translate3d(0,${fmt(-Math.min(hund, 2) * 112)}px,0)`;

  /* text swap: Uploading -> Done */
  const oa = OLD_A(t), na = NEW_A(t);
  el.num.style.opacity = fmt(oa, 3);
  el.num.style.transform = `translate3d(0,${fmt((1 - oa) * (t < 9 ? -14 : 10))}px,0)`;
  el.done.style.opacity = fmt(na, 3);
  el.done.style.transform = `translate3d(0,${fmt((1 - na) * 14)}px,0) scale(${fmt(0.96 + 0.04 * na, 4)})`;
  el.checkWipe.setAttribute('transform', `scale(${fmt(CHECK(t), 4)} 1)`);
  el.titleA.style.opacity = el.subA.style.opacity = fmt(oa, 3);
  el.titleB.style.opacity = el.subB.style.opacity = fmt(na, 3);
  el.titleB.style.transform = el.subB.style.transform = `translate3d(0,${fmt((1 - na) * 6)}px,0)`;

  const shown = Math.min(99, Math.floor(p + 1e-6));
  let text;
  if (t < 0.5 || t >= RESET) text = '0|Calculating…';
  else {
    const secs = Math.max(1, Math.ceil((99 - shown) / 20));
    text = (64 * shown / 100).toFixed(1) + '|About ' + secs + (secs === 1 ? ' second left' : ' seconds left');
  }
  if (text !== lastText) {
    lastText = text;
    const [a, c] = text.split('|');
    el.mb.textContent = a; el.eta.textContent = c;
  }
}

/* ---------- layout: card ~70% of the frame width ---------- */
let SCALE = 1;
function fit() {
  const w = innerWidth, h = innerHeight;
  SCALE = Math.min((w < 720 ? 0.92 : 0.70) * w / 1000, 0.78 * h / 540);
  document.documentElement.style.setProperty('--s', SCALE.toFixed(4));
}
addEventListener('resize', fit);
fit();

/* ------------------------------------------------------------------ *
 *  Sound. All synthesized with Web Audio; one event list drives both
 *  live playback and the offline render used for the recording.
 * ------------------------------------------------------------------ */

const EVENTS = [];
steps.forEach((s, i) => {
  if (s.t > 4.66 && s.t < 5.2 || s.t > 7.18 && s.t < 7.4) EVENTS.push({ t: s.t, k: 'step', v: 0.5, seed: i });
  else if (s.v > 0.8) EVENTS.push({ t: s.t, k: 'step', v: s.t < 2.5 ? 0.62 : 0.85, seed: i });
});
EVENTS.push(
  { t: 4.70, k: 'hmph', pitch: 1.0, len: 0.17 },
  { t: 5.00, k: 'hmph', pitch: 1.06, len: 0.15 },
  { t: 5.38, k: 'hmph', pitch: 0.86, len: 0.34, breathy: 1 },
  { t: 7.19, k: 'hmph', pitch: 1.18, len: 0.16 },
  { t: 7.58, k: 'thud', v: 1 },
  { t: POP, k: 'pop' },
  { t: 8.52, k: 'flop' },
  { t: 8.66, k: 'hmph', pitch: 0.78, len: 0.55, breathy: 1 },
);
EVENTS.sort((a, b) => a.t - b.t);

function makeNoise(ctx) {
  const len = ctx.sampleRate * 1.5, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0), r = rng(7);
  for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
  return buf;
}
function envGain(ctx, t, attack, peak, decay) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  return g;
}
function noiseSrc(ctx, noise, t, dur, offset = 0) {
  const s = ctx.createBufferSource(); s.buffer = noise;
  s.start(t, offset % 1.2, dur); return s;
}
const SFX = {
  step(ctx, out, noise, t, e) {
    const r = rng(e.seed + 11), v = e.v;
    const n = noiseSrc(ctx, noise, t, 0.08, r());
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900 + r() * 500; bp.Q.value = 0.9;
    n.connect(bp).connect(envGain(ctx, t, 0.003, 0.11 * v, 0.06)).connect(out);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(150 + r() * 25, t); o.frequency.exponentialRampToValueAtTime(58, t + 0.07);
    o.connect(envGain(ctx, t, 0.002, 0.16 * v, 0.08)).connect(out);
    o.start(t); o.stop(t + 0.12);
  },
  hmph(ctx, out, noise, t, e) {
    const p = e.pitch, len = e.len;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(2300, t); lp.frequency.exponentialRampToValueAtTime(420, t + len + 0.05);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + (e.breathy ? 0.05 : 0.014));
    g.gain.setValueAtTime(0.13, t + len * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.08);
    lp.connect(g).connect(out);
    for (const [type, mul, gain] of [['sawtooth', 1, 0.7], ['triangle', 0.5, 0.9]]) {
      const o = ctx.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(205 * p * mul, t);
      o.frequency.exponentialRampToValueAtTime(122 * p * mul, t + len);
      const og = ctx.createGain(); og.gain.value = gain;
      o.connect(og).connect(lp); o.start(t); o.stop(t + len + 0.12);
    }
    const n = noiseSrc(ctx, noise, t, len + 0.1, p);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
    n.connect(hp).connect(envGain(ctx, t, 0.006, e.breathy ? 0.07 : 0.045, e.breathy ? len : 0.07)).connect(out);
  },
  thud(ctx, out, noise, t, e) {
    const v = e.v || 1;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(125, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.22);
    o.connect(envGain(ctx, t, 0.003, 0.62 * v, 0.34)).connect(out); o.start(t); o.stop(t + 0.4);
    const k = ctx.createOscillator(); k.type = 'triangle';
    k.frequency.setValueAtTime(270, t); k.frequency.exponentialRampToValueAtTime(190, t + 0.06);
    k.connect(envGain(ctx, t, 0.001, 0.09 * v, 0.08)).connect(out); k.start(t); k.stop(t + 0.12);
    const n = noiseSrc(ctx, noise, t, 0.1, 0.3);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
    n.connect(lp).connect(envGain(ctx, t, 0.001, 0.32 * v, 0.05)).connect(out);
  },
  pop(ctx, out, noise, t) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(1150, t + 0.035);
    o.connect(envGain(ctx, t, 0.002, 0.42, 0.13)).connect(out); o.start(t); o.stop(t + 0.2);
    const tick = ctx.createOscillator(); tick.type = 'sine'; tick.frequency.value = 2600;
    tick.connect(envGain(ctx, t, 0.001, 0.05, 0.03)).connect(out); tick.start(t); tick.stop(t + 0.06);
    [[783.99, 0.035, 0.012], [1046.5, 0.05, 0.03], [1567.98, 0.03, 0.05]].forEach(([f, g, d]) => {
      const s = ctx.createOscillator(); s.type = 'sine'; s.frequency.value = f;
      s.connect(envGain(ctx, t + d, 0.006, g, 0.75)).connect(out); s.start(t + d); s.stop(t + d + 0.8);
    });
  },
  flop(ctx, out, noise, t) {
    SFX.thud(ctx, out, noise, t, { v: 0.42 });
    const n = noiseSrc(ctx, noise, t, 0.18, 0.7);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    n.connect(lp).connect(envGain(ctx, t, 0.004, 0.22, 0.14)).connect(out);
  },
};
function buildBus(ctx) {
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.003; comp.release.value = 0.15;
  const master = ctx.createGain(); master.gain.value = 0.9;
  comp.connect(master).connect(ctx.destination);
  return { input: comp, master };
}
const play = (ctx, bus, noise, e, when) => SFX[e.k](ctx, bus.input, noise, when, e);

// offline render of one loop, for the recording
window.__audioWav = async () => {
  const sr = 48000, ctx = new OfflineAudioContext(2, sr * LOOP, sr);
  const bus = buildBus(ctx), noise = makeNoise(ctx);
  for (const e of EVENTS) play(ctx, bus, noise, e, e.t);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
  w(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
    out.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.__render = render;

if (CAPTURE) {
  render(+(qs.get('t') || 0));
  document.fonts.ready.then(() => { render(+(qs.get('t') || 0)); window.__ready = true; });
  return;
}

/* ---------- live playback ---------- */
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, bus = null, noise = null, muted = false;
const scheduled = new Set();
function ensureAudio() {
  if (!ctx && AC) { ctx = new AC({ latencyHint: 'interactive' }); bus = buildBus(ctx); noise = makeNoise(ctx); }
  if (ctx && ctx.state === 'suspended') ctx.resume();
}
ensureAudio();   // starts at once where the browser allows it, otherwise on the first touch
const unlock = () => ensureAudio();
addEventListener('pointerdown', unlock, { passive: true });
addEventListener('keydown', unlock);

const btn = document.getElementById('mute');
btn.addEventListener('click', () => {
  // the first press only unlocks audio that the browser held back, so sound stays on
  if (ctx && ctx.state !== 'running' && !muted) { ensureAudio(); return; }
  muted = !muted;
  btn.setAttribute('aria-pressed', String(muted));
  btn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  if (bus) bus.master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.015);
});

const t0 = performance.now();
function frame(now) {
  const elapsed = (now - t0) / 1000;
  const t = elapsed % LOOP;
  render(t);
  if (ctx && ctx.state === 'running') {
    const cycle = Math.floor(elapsed / LOOP), ahead = 0.12;
    for (let c = cycle; c <= cycle + 1; c++) {
      for (let i = 0; i < EVENTS.length; i++) {
        const at = c * LOOP + EVENTS[i].t - elapsed;
        if (at < -0.01 || at > ahead) continue;
        const key = c * 1000 + i;
        if (scheduled.has(key)) continue;
        scheduled.add(key);
        play(ctx, bus, noise, EVENTS[i], ctx.currentTime + Math.max(0, at));
      }
    }
    if (scheduled.size > 400) for (const k of scheduled) if (k < (cycle - 1) * 1000) scheduled.delete(k);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
